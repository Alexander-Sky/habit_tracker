[project]
name = "habit-tracker"
version = "1.0.0"
description = "Трекер полезных привычек: бэкенд SPA с напоминаниями в Telegram"
authors = [
    {name = "Alexander Schischkin", email = "schischkin1212@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2,<7.0)",
    "djangorestframework (>=3.15,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5,<6.0.0)",
    "drf-spectacular (>=0.28,<1.0.0)",
    "django-filter (>=24.0)",
    "django-cors-headers (>=4.7,<5.0.0)",
    "celery (>=5.4,<6.0.0)",
    "redis (>=5.0)",
    "requests (>=2.32,<3.0.0)",
    "python-dotenv (>=1.0,<2.0.0)",
    "pillow (>=11.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.6)",
    "flake8 (>=7.1)",
    "isort (>=5.13)"
]
[flake8]
# 79 символов — норма из PEP 8 для кода, который читают в две колонки.
# В Django-проекте так не выходит: имена приложений и путей длинные,
# перенос делает строку менее читаемой, а не более.
max-line-length = 119
exclude =
    .git,
    .venv,
    __pycache__,
    */migrations/*,
    manage.py