[flake8]
# 79 символов — норма из PEP 8 для кода, который читают в две колонки.
# В Django-проекте так не выходит: имена приложений и путей длинные,
# перенос делает строку менее читаемой, а не более.
max-line-length = 119
exclude =
    .git,
    .venv,
    __pycache__,
    */migrations/*,
    manage.py
